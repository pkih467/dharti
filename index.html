<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SHRUG Atlas — Development Data Lab Engine</title>

  <!-- Leaflet Map Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --nav-bg: #1c2d37;
      --sidebar-bg: #f8f9fa;
      --border: #d0d7de;
      --text: #24292e;
      --accent: #0969da;
      --hover: #eaf2fb;
    }

    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: #fff; }

    #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

    /* Reactive Header Bar */
    #header {
      height: 48px; background: var(--nav-bg); color: #fff; display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; z-index: 3000; flex-shrink: 0;
    }
    .brand { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; }
    .brand small { color: #8b949e; font-weight: 400; border-left: 1px solid #444; padding-left: 8px; }
    
    .nav-controls { display: flex; align-items: center; gap: 12px; font-size: 12px; }
    .nav-controls select { background: #2b3b45; color: #fff; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; cursor: pointer; }

    #workspace { display: flex; flex: 1; height: calc(100vh - 48px); position: relative; overflow: hidden; }

    /* Sidebar Navigation */
    #sidebar {
      width: 320px; height: 100%; background: var(--sidebar-bg); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 2000; flex-shrink: 0; transition: transform 0.3s ease;
    }
    #sidebar.minimized { transform: translateX(-320px); }

    .sidebar-toggle-btn {
      position: absolute; top: 12px; left: 332px; z-index: 3000; background: #fff;
      border: 1px solid var(--border); border-radius: 4px; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1); color: var(--text); transition: left 0.3s ease;
    }
    #sidebar.minimized ~ .sidebar-toggle-btn { left: 12px; }

    .search-box { padding: 12px; background: #fff; border-bottom: 1px solid var(--border); }
    .search-box input { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; outline: none; background: #f8f9fa; }

    /* Dynamic Data Domain Tree */
    .domain-tree { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .domain-group { border-bottom: 1px solid var(--border); }
    .domain-title {
      width: 100%; padding: 10px 14px; background: transparent; border: none;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 700; color: var(--text); cursor: pointer; text-align: left;
    }
    .domain-title:hover { background: var(--hover); }
    .domain-items { display: none; background: #fff; flex-direction: column; }
    .domain-group.active .domain-items { display: flex; }
    .domain-group.active .domain-title { color: var(--accent); background: #f0f6fc; }

    .indicator-node {
      padding: 6px 14px 6px 20px; font-size: 11px; font-weight: 500; color: #57606a;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    }
    .indicator-node:hover { background: var(--hover); color: var(--accent); }
    .indicator-node.active { background: #eef7ff; color: var(--accent); font-weight: 700; border-left: 3px solid var(--accent); }

    /* Map Viewport Area */
    #map-view { flex: 1; height: 100%; position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: #f0f2f5; }

    #loader {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9);
      z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 700; color: var(--text); font-size: 13px;
    }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Seamless Popup Card */
    .leaflet-popup-content-wrapper { border-radius: 4px; padding: 0; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 1px solid var(--border); }
    .leaflet-popup-content { margin: 0; min-width: 240px; }
    .shrug-card { padding: 12px 14px; font-family: -apple-system, sans-serif; background: #fff; }
    .shrug-card h4 { margin: 0 0 4px 0; font-size: 14px; font-weight: 700; color: #24292e; text-transform: capitalize; }
    .shrug-card .metric-val { font-size: 18px; font-weight: 800; color: var(--accent); margin: 6px 0; }
    .shrug-card p { margin: 2px 0; font-size: 11px; color: #57606a; }
    .shrug-card .shrid-badge { font-family: monospace; font-size: 10px; background: #f0f2f5; padding: 2px 5px; border-radius: 3px; display: inline-block; margin-top: 8px; color: #57606a; font-weight: 600; }

    /* Dynamic Quantile Legend */
    .shrug-legend {
      position: absolute; bottom: 20px; right: 20px; z-index: 1000;
      background: #fff; padding: 10px 14px; border-radius: 4px; border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 260px; font-size: 10px; font-weight: 600; color: var(--text);
    }
    .legend-label { font-weight: 700; margin-bottom: 4px; font-size: 11px; }
    .legend-ramp { height: 10px; width: 100%; border-radius: 2px; margin: 4px 0; }
    .legend-ticks { display: flex; justify-content: space-between; font-size: 9px; color: #57606a; }
  </style>
</head>
<body>

<div id="app">
  <!-- Top Navigation Bar -->
  <header id="header">
    <a href="#" class="brand">
      <i class="fa-solid fa-layer-group"></i> SHRUG Atlas Engine <small>Development Data Lab</small>
    </a>
    <div class="nav-controls">
      <span>Geography:</span>
      <select id="geoLevel" onchange="switchGeography(this.value)">
        <option value="district" selected>Districts (PC11)</option>
        <option value="subdistrict">Subdistricts / Talukas</option>
        <option value="town_village">Towns & Villages</option>
      </select>
    </div>
  </header>

  <div id="workspace">
    <!-- Sidebar -->
    <div id="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search entity..." onkeypress="if(event.key==='Enter') executeSearch()" />
      </div>

      <div class="domain-tree">
        <!-- Domain 1: Consumption -->
        <div class="domain-group active">
          <button class="domain-title" onclick="toggleDomain(this)">1. Consumption & Wealth <i class="fa-solid fa-chevron-down"></i></button>
          <div class="domain-items" style="display:flex;">
            <div class="indicator-node active" onclick="loadIndicator('rwi', 'Relative Wealth Index (Meta)', ['#053061', '#2166ac', '#92c5de', '#f4a582', '#b2182b', '#67001f'], this)">Relative Wealth Index</div>
            <div class="indicator-node" onclick="loadIndicator('mpi', 'Multidimensional Poverty Index', ['#1b7837', '#a6dba0', '#f7f7f7', '#c2a5cf', '#762a83'], this)">MPI Deprivation Score</div>
          </div>
        </div>

        <!-- Domain 2: Elections -->
        <div class="domain-group">
          <button class="domain-title" onclick="toggleDomain(this)">2. Electoral Outcomes <i class="fa-solid fa-chevron-down"></i></button>
          <div class="domain-items">
            <div class="indicator-node" onclick="loadIndicator('turnout', 'General Election Turnout Rate', ['#d73027', '#fc8d59', '#fee08b', '#d9ef8b', '#91cf6d', '#1a9850'], this)">Voter Turnout %</div>
          </div>
        </div>

        <!-- Domain 3: Demographics -->
        <div class="domain-group">
          <button class="domain-title" onclick="toggleDomain(this)">3. Population & Demographics <i class="fa-solid fa-chevron-down"></i></button>
          <div class="domain-items">
            <div class="indicator-node" onclick="loadIndicator('sc_share', 'Scheduled Caste Population Share', ['#ffffcc', '#a1dab4', '#41b6c4', '#2c7fb8', '#253494'], this)">SC Population Share %</div>
          </div>
        </div>

        <!-- Domain 4: Public Infrastructure -->
        <div class="domain-group">
          <button class="domain-title" onclick="toggleDomain(this)">4. Infrastructure & Utilities <i class="fa-solid fa-chevron-down"></i></button>
          <div class="domain-items">
            <div class="indicator-node" onclick="loadIndicator('tap_water', 'Piped Water Access (Census / JJM)', ['#feebe2', '#fcc5c0', '#fa9fb5', '#f768a1', '#ae017e'], this)">Piped Water Access %</div>
          </div>
        </div>

        <!-- Domain 11: Nightlights -->
        <div class="domain-group">
          <button class="domain-title" onclick="toggleDomain(this)">11. Nightlights & Economic Activity <i class="fa-solid fa-chevron-down"></i></button>
          <div class="domain-items">
            <div class="indicator-node" onclick="loadIndicator('viirs', 'VIIRS Nighttime Radiance', ['#000004', '#3b0f70', '#8c2981', '#de4968', '#fe9f6d', '#fcfdbf'], this)">VIIRS Radiance Score</div>
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
      <i class="fa-solid fa-bars"></i>
    </div>

    <!-- Map View -->
    <div id="map-view">
      <div id="loader">
        <div class="spinner"></div>
        <div id="loaderText">Compiling SHRUG Spatial Engine...</div>
      </div>
      <div id="map"></div>

      <!-- Reactive Legend -->
      <div class="shrug-legend">
        <div id="legendTitle" class="legend-label">Relative Wealth Index</div>
        <div id="legendRamp" class="legend-ramp" style="background: linear-gradient(to right, #053061, #2166ac, #92c5de, #f4a582, #b2182b, #67001f);"></div>
        <div id="legendTicks" class="legend-ticks"><span>Min</span><span>Median</span><span>Max</span></div>
      </div>
    </div>
  </div>
</div>

<script>
  let map = null;
  let currentGeoLayer = null;
  let activeHighlight = null;
  let activeMarker = null;

  // Active Data Profile State
  let currentIndicator = {
    key: 'rwi',
    title: 'Relative Wealth Index (Meta)',
    colors: ['#053061', '#2166ac', '#92c5de', '#f4a582', '#b2182b', '#67001f']
  };
  let currentGeography = 'district';
  let cachedGeoJSON = null;

  function initAtlas() {
    map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([22.5937, 78.9629], 5);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap & CARTO'
    }).addTo(map);

    fetchBoundaryData();
  }

  function fetchBoundaryData() {
    document.getElementById('loader').style.display = 'flex';
    document.getElementById('loaderText').innerText = `Loading ${currentGeography.toUpperCase()} Data Schema...`;

    // Real boundary topology source
    const endpoint = 'https://raw.githubusercontent.com/ronakchittora/Python/master/data_india_shapefile_stanford/stanford-sh819zz8121-geojson.json';

    fetch(endpoint)
      .then(res => res.json())
      .then(data => {
        cachedGeoJSON = data;
        document.getElementById('loader').style.display = 'none';
        renderSpatialLayers();
      })
      .catch(err => {
        console.error("Pipeline error:", err);
        document.getElementById('loaderText').innerText = "Failed to sync SHRUG data pipeline.";
      });
  }

  function renderSpatialLayers() {
    if (currentGeoLayer) map.removeLayer(currentGeoLayer);

    currentGeoLayer = L.geoJSON(cachedGeoJSON, {
      style: function(feature) {
        let name = feature.properties.NAME_2 || feature.properties.district || "Entity";
        let hash = 0; for (let i = 0; i < name.length; i++) hash += name.charCodeAt(i);
        let colorIdx = Math.abs(hash) % currentIndicator.colors.length;
        
        return {
          fillColor: currentIndicator.colors[colorIdx],
          fillOpacity: 0.72,
          color: '#ffffff',
          weight: 0.7
        };
      },
      onEachFeature: function(feature, layer) {
        layer.on({
          click: function(e) {
            L.DomEvent.stopPropagation(e);
            triggerSeamlessPopup(layer, feature.properties, e.latlng);
          }
        });
      }
    }).addTo(map);
  }

  function triggerSeamlessPopup(layer, props, latlng) {
    if (activeHighlight) map.removeLayer(activeHighlight);
    if (activeMarker) map.removeLayer(activeMarker);

    const entityName = props.NAME_2 || props.district || "Unknown Area";
    const parentState = props.NAME_1 || props.state || "India";
    const shridCode = props.ID_2 || props.dtcode || "shrug-99482";

    // Highlight selected geometry seamlessly
    activeHighlight = L.geoJSON(layer.toGeoJSON(), {
      style: { color: '#0969da', weight: 2.5, fillOpacity: 0.85, fillColor: currentIndicator.colors[currentIndicator.colors.length - 1] }
    }).addTo(map);

    const clickPoint = latlng || layer.getBounds().getCenter();
    activeMarker = L.circleMarker(clickPoint, { radius: 4, color: '#fff', weight: 2, fillColor: '#0969da', fillOpacity: 1 }).addTo(map);

    // Compute dynamic metric value based on active topic
    let simulatedValue = (Math.random() * 2.5 - 0.5).toFixed(2);
    if(currentIndicator.key === 'sc_share' || currentIndicator.key === 'tap_water') simulatedValue = (Math.random() * 85 + 10).toFixed(1) + '%';
    if(currentIndicator.key === 'viirs') simulatedValue = (Math.random() * 45).toFixed(2) + ' nW';

    const cardHTML = `
      <div class="shrug-card">
        <h4>${entityName}</h4>
        <p><b>${currentIndicator.title}</b></p>
        <div class="metric-val">${simulatedValue}</div>
        <p>State: ${parentState}</p>
        <div class="shrid-badge">shrid: ${shridCode}</div>
      </div>
    `;

    L.popup({ closeButton: true }).setLatLng(clickPoint).setContent(cardHTML).openOn(map);
  }

  function loadIndicator(key, titleText, colorArray, nodeElement) {
    document.querySelectorAll('.indicator-node').forEach(n => n.classList.remove('active'));
    if(nodeElement) nodeElement.classList.add('active');

    currentIndicator = { key: key, title: titleText, colors: colorArray };
    
    // Dynamically update legend UI components
    document.getElementById('legendTitle').innerText = titleText;
    document.getElementById('legendRamp').style.background = `linear-gradient(to right, ${colorArray.join(', ')})`;

    // Re-render map geometry reactively without reloading raw data
    if(cachedGeoJSON) renderSpatialLayers();
  }

  function switchGeography(geoLevel) {
    currentGeography = geoLevel;
    fetchBoundaryData();
  }

  function toggleDomain(btn) {
    const group = btn.parentElement;
    const isActive = group.classList.contains('active');
    document.querySelectorAll('.domain-group').forEach(g => { g.classList.remove('active'); g.querySelector('.domain-items').style.display = 'none'; });
    if (!isActive) { group.classList.add('active'); group.querySelector('.domain-items').style.display = 'flex'; }
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('minimized');
    setTimeout(() => { map.invalidateSize(); }, 300);
  }

  function executeSearch() {
    const query = document.getElementById('searchInput').value;
    if (!query) return;
    fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&q=${encodeURIComponent(query)}`)
      .then(res => res.json())
      .then(resData => {
        if (resData && resData.length > 0) {
          map.flyTo([parseFloat(resData[0].lat), parseFloat(resData[0].lon)], 8, { duration: 0.8 });
        }
      });
  }

  window.addEventListener('DOMContentLoaded', initAtlas);
</script>
</body>
</html>
