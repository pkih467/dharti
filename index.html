<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>INDIA GEOSPATIAL</title>

  <!-- MapLibre GL JS (WebGL Vector Rendering Engine) -->
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --brand-blue: #0080a5;
      --sidebar-bg: #e5f1f5;
      --hover-bg: #d2e6ed;
      --text-dark: #1e3a47;
      --border-color: #c4e0e8;
    }

    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: #e0e0e0; }

    #app-container { display: flex; width: 100vw; height: 100vh; position: relative; }

    /* Left Sidebar */
    #sidebar {
      width: 310px; height: 100%; background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color); display: flex; flex-direction: column;
      z-index: 10; flex-shrink: 0;
    }

    .brand-header {
      padding: 18px 20px; background: #fff; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between;
    }

    .brand-title {
      font-size: 20px; font-weight: 900; letter-spacing: -0.5px; color: var(--text-dark);
      display: flex; align-items: center; gap: 10px;
    }
    .brand-title i { color: var(--brand-blue); font-size: 20px; }

    /* Accordion Menu */
    .accordion-menu { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .accordion-item { border-bottom: 1px solid var(--border-color); }

    .accordion-header {
      width: 100%; padding: 13px 18px; background: transparent; border: none;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; font-weight: 700; color: var(--text-dark); cursor: pointer;
      text-align: left; transition: background 0.2s;
    }
    .accordion-header:hover { background: var(--hover-bg); }

    .accordion-content { display: none; background: rgba(255, 255, 255, 0.65); flex-direction: column; }
    .accordion-item.active .accordion-content { display: flex; }
    .accordion-item.active .accordion-header { color: var(--brand-blue); background: rgba(255, 255, 255, 0.4); }

    .sub-item {
      padding: 8px 18px 8px 24px; font-size: 12px; font-weight: 600; color: #333;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: background 0.2s;
    }
    .sub-item:hover { background: #fff; color: var(--brand-blue); }
    .sub-item.active { background: #fff; color: var(--brand-blue); font-weight: 800; border-left: 4px solid var(--brand-blue); }

    /* Map Area */
    #map-container { flex: 1; height: 100%; position: relative; }
    #map { width: 100%; height: 100%; }

    /* Search Input */
    .floating-search {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      background: #fff; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      display: flex; align-items: center; padding: 6px 12px; width: 320px;
    }
    .floating-search i { color: #777; margin-right: 8px; font-size: 13px; }
    .floating-search input { border: none; outline: none; width: 100%; font-size: 13px; font-weight: 600; color: #333; }

    /* Legend Box */
    .shrug-legend {
      position: absolute; bottom: 20px; right: 20px; z-index: 10;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(4px);
      padding: 12px 16px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      width: 280px; font-size: 10px; font-weight: 700; color: #333;
    }
    .legend-bar { height: 14px; width: 100%; border-radius: 2px; margin: 6px 0; }
    .legend-ticks { display: flex; justify-content: space-between; font-size: 10px; color: #444; font-weight: 600; }
  </style>
</head>
<body>

<div id="app-container">
  <div id="sidebar">
    <div class="brand-header">
      <div class="brand-title">
        <i class="fa-solid fa-earth-asia"></i>
        <span>INDIA GEOSPATIAL</span>
      </div>
    </div>

    <div class="accordion-menu">
      <div class="accordion-item active">
        <button class="accordion-header" onclick="toggleAccordion(this)">
          Administrative Boundaries <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="accordion-content" style="display:flex;">
          <div class="sub-item active" onclick="switchTheme('districts', 'District Boundaries (DataMeet)', this)">District Boundaries</div>
          <div class="sub-item" onclick="switchTheme('states', 'State Boundaries', this)">State Boundaries</div>
        </div>
      </div>
    </div>
  </div>

  <div id="map-container">
    <div class="floating-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search District or State..." onkeypress="if(event.key==='Enter') searchLocation()" />
    </div>

    <div id="map"></div>

    <div class="shrug-legend">
      <div id="legendTitleBox" style="font-size:11px; font-weight:800; margin-bottom:4px;">District Boundaries (DataMeet)</div>
      <div class="legend-bar" style="background: linear-gradient(to right, #c57071, #d49893, #e2cfc4, #a1c1be, #5a8a92, #386670);"></div>
      <div class="legend-ticks">
        <span>Region Units</span>
        <span>Data Boundaries</span>
      </div>
    </div>
  </div>
</div>

<script>
  // Initialize MapLibre WebGL Engine
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
    center: [78.9629, 20.5937],
    zoom: 4.5
  });

  map.addControl(new maplibregl.NavigationControl(), 'top-right');

  map.on('load', () => {
    // Fetch Real District Polygons (GeoJSON Payload)
    fetch('https://raw.githubusercontent.com/datameet/maps/master/Districts/Admin2.geojson')
      .then(res => res.json())
      .then(geoJsonData => {
        
        map.addSource('districts_data', {
          type: 'geojson',
          data: geoJsonData
        });

        // Real Polygon Fill Layer using WebGL Shading
        map.addLayer({
          id: 'districts-fill',
          type: 'fill',
          source: 'districts_data',
          paint: {
            'fill-color': [
              'match',
              ['%', ['coalesce', ['get', 'dt_code'], 1], 5],
              0, '#c57071',
              1, '#d49893',
              2, '#e2cfc4',
              3, '#a1c1be',
              4, '#5a8a92',
              '#386670'
            ],
            'fill-opacity': 0.65
          }
        });

        // Crisp Boundary Borders
        map.addLayer({
          id: 'districts-border',
          type: 'line',
          source: 'districts_data',
          paint: {
            'line-color': '#ffffff',
            'line-width': 0.8
          }
        });

        // Real Data Popup Card on Click
        map.on('click', 'districts-fill', (e) => {
          const props = e.features[0].properties;
          const distName = props.district || props.DISTRICT || props.dtname || "District";
          const stateName = props.stname || props.ST_NAME || "India";
          const dtCode = props.dt_code || props.censuscode || "N/A";

          new maplibregl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(`
              <div style="padding:10px; font-family:-apple-system,sans-serif;">
                <h3 style="margin:0 0 6px 0; font-size:18px; font-weight:800; color:#1c1c1e;">${distName}</h3>
                <p style="margin:2px 0; font-size:12px; color:#444;"><b>State:</b> ${stateName}</p>
                <p style="margin:2px 0; font-size:12px; color:#444;"><b>District Code:</b> ${dtCode}</p>
              </div>
            `)
            .addTo(map);
        });

        map.on('mouseenter', 'districts-fill', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'districts-fill', () => map.getCanvas().style.cursor = '');
      })
      .catch(err => console.error("Data load error:", err));
  });

  function toggleAccordion(btn) {
    const item = btn.parentElement;
    const isActive = item.classList.contains('active');
    document.querySelectorAll('.accordion-item').forEach(el => {
      el.classList.remove('active');
      el.querySelector('.accordion-content').style.display = 'none';
    });
    if (!isActive) {
      item.classList.add('active');
      item.querySelector('.accordion-content').style.display = 'flex';
    }
  }

  function switchTheme(key, label, el) {
    document.querySelectorAll('.sub-item').forEach(i => i.classList.remove('active'));
    if (el) el.classList.add('active');
    document.getElementById('legendTitleBox').innerText = label;
  }

  function searchLocation() {
    const query = document.getElementById('searchInput').value;
    if (!query) return;
    fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&q=${encodeURIComponent(query)}`)
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          map.flyTo({ center: [parseFloat(data[0].lon), parseFloat(data[0].lat)], zoom: 8, duration: 1000 });
        }
      });
  }
</script>
</body>
</html>
