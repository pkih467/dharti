name: DHARTI Automated Daily Data Sync (3 AM IST)

on:
  schedule:
    # Runs at 21:30 UTC = 3:00 AM IST (Indian Standard Time)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  update-datasets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas geopandas pyarrow duckdb requests huggingface_hub

      - name: Execute Live Scrapers & Hugging Face Sync
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo " Starting DHARTI automated daily ETL process at 3:00 AM IST..."
          python scripts/etl_pipeline.py
          echo " Daily Sync Complete!"

      - name: Log Sync Status
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          echo "Last successful sync: $(date -u)" > last_sync_status.txt
          git add last_sync_status.txt
          git commit -m "chore(etl): automated daily sync log [3:00 AM IST]" || exit 0
          git push
