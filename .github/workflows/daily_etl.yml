name: DHARTI Automated Daily Data Sync (3 AM IST)

on:
  schedule:
    # Runs at 21:30 UTC every day = 3:00 AM IST (Indian Standard Time)
    - cron: '30 21 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  update-datasets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ETL & Geospatial Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas geopandas pyarrow duckdb requests huggingface_hub

      - name: Execute Live Government & Global API Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo " Starting DHARTI automated daily ETL process at 3:00 AM IST..."
          
          # 1. Fetch live Jal Jeevan Mission, UDISE+, ABDM, and PFMS feeds
          python scripts/fetch_gov_apis.py
          
          # 2. Sync ECI & TCPD election microdata updates
          python scripts/sync_election_data.py
          
          # 3. Compress into Parquet and push to Hugging Face Hub ($0 Storage)
          python scripts/push_to_huggingface.py
          
          echo " Daily ETL Sync Complete! Datasets successfully updated on Hugging Face."

      - name: Auto-Commit Status Metrics to Repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          echo "Last successful sync: $(date -u)" > last_sync_status.txt
          git add last_sync_status.txt
          git commit -m "chore(etl): automated daily sync log update [3:00 AM IST]" || exit 0
          git push
