name: Daily Data ETL Sync

on:
  schedule:
    # 21:30 UTC = 3:00 AM IST (Indian Standard Time)
    - cron: '30 21 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow huggingface_hub requests

      - name: Execute Master Data Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/sync_all_sources.py
